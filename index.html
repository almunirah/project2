<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3b2416"><title>BeanGo Coffee</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="topbar"><div><div class="eyebrow">ORDER • PICKUP • ENJOY</div><h1>BeanGo Coffee ☕</h1><p>Fresh coffee, faster pickup.</p></div><button id="cartBtn" class="cart-btn">🛒 <span id="cartCount">0</span></button></header><section class="hero"><div><span class="badge">Pickup Ready in 10–15 min</span><h2>Kopi kegemaran anda,<br>siap bila anda sampai.</h2><p>Pilih minuman, customize ikut citarasa, dan buat order terus dari telefon.</p><button class="primary" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">Order Sekarang</button></div><div class="cup">☕</div></section><section class="controls" id="menu"><div class="search"><input id="searchInput" placeholder="Cari kopi..." /></div><div id="categories" class="chips"></div></section><section><div class="section-head"><div><h3>Menu</h3><p id="menuSubtitle">Pilihan popular hari ini</p></div></div><div id="menuGrid" class="menu-grid"></div></section><section id="orderStatus" class="status-card hidden"></section></div><div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div><div id="cartDrawer" class="drawer hidden"><div class="drawer-card"><div class="drawer-head"><h3>Pesanan Anda</h3><button class="close" id="closeCart">×</button></div><div id="cartItems"></div><div class="cart-footer"><div class="total-row"><span>Jumlah</span><strong id="cartTotal">RM0.00</strong></div><button id="checkoutBtn" class="primary full">Checkout</button></div></div></div><script src="app.js"></script></body></html>
